# =====================================================================
# SAVORA RESTAURANT MANAGEMENT SYSTEM - SPRING BOOT CONFIGURATION
# =====================================================================

spring.application.name=savora-restaurant
spring.config.import=optional:classpath:application-local.properties
server.port=8083
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ---------------------------------------------------------------------
# 1. CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/savora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------
# 2. CẤU HÌNH ĐĂNG NHẬP GOOGLE OAUTH2
# Redirect URI trên Google Cloud Console: http://localhost:8083/login/oauth2/code/google
# ---------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=574426982283-m4bujhk9iqevcdpc902b3s986j5bisv6.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ---------------------------------------------------------------------
# 3. CẤU HÌNH ĐĂNG NHẬP FACEBOOK OAUTH2
# Redirect URI trên Facebook Developer: http://localhost:8083/login/oauth2/code/facebook
# ---------------------------------------------------------------------
spring.security.oauth2.client.registration.facebook.client-id=1589100456304598
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:YOUR_FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,first_name,last_name,email,picture.type(large)

# ---------------------------------------------------------------------
# 4. CẤU HÌNH FRONTEND TĨNH (HTML, CSS, JS) TRÊN VS CODE
# ---------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

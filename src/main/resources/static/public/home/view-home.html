<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Savora Restaurant</title>
    <link rel="stylesheet" href="/assets/css/public/global.css">
    <link rel="stylesheet" href="/assets/css/public/login.css">
</head>
<body>
    <div id="app-header"></div>

    <main class="container" style="padding: 56px 20px;">
        <div class="auth-wrapper" style="max-width: 620px; text-align: center;">
            <h1 style="font-family: var(--font-heading); font-size: 2.2rem; color: var(--primary-color); margin-bottom: 12px;">
                Welcome to Savora Restaurant
            </h1>
            <p style="color: var(--text-muted); margin-bottom: 24px;">
                The project template is ready. Below is your current authentication session status:
            </p>

            <div id="home-user-card" style="padding: 20px; border-radius: 10px; background: var(--bg-cream); border: 1px solid var(--border-color);">
                <p>Checking authentication status...</p>
            </div>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="/assets/js/common/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const box = document.getElementById('home-user-card');
            try {
                const res = await SavoraApp.fetchApi('/api/auth/me');
                const u = res.data;
                box.innerHTML = `
                    <img src="${u.avatarUrl || 'https://res.cloudinary.com/dej5mxdrt/image/upload/v1780061324/OIP_dbbjuo.jpg'}"
                         alt="Avatar"
                         style="width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; object-fit: cover; border: 2px solid var(--primary-color);">
                    <h3 style="margin-bottom: 6px;">Signed In Successfully!</h3>
                    <p><strong>Full Name:</strong> ${u.fullName}</p>
                    <p><strong>Email:</strong> ${u.email}</p>
                    <p><strong>Role:</strong> <span class="badge badge-available">${u.roleName}</span></p>
                `;
            } catch (_) {
                box.innerHTML = `
                    <p style="margin-bottom: 14px;">You are not signed in.</p>
                    <a href="/login" class="btn btn-primary">Go to Sign In</a>
                `;
            }
        });
    </script>
</body>
</html>

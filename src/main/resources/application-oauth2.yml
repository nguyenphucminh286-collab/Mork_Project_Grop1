spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:574426982283-m4bujhk9iqevcdpc902b3s986j5bisv6.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope: email,profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:1589100456304598}
            client-secret: ${FACEBOOK_CLIENT_SECRET:YOUR_FACEBOOK_CLIENT_SECRET}
            scope: public_profile
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,first_name,last_name,email,picture.type(large)

spring:
  application:
    name: savora-restaurant
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/savora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  thymeleaf:
    cache: false
server:
  port: ${SERVER_PORT:8080}

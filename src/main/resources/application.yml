spring:
  application:
    name: savora-restaurant
  config:
    import:
      - optional:classpath:application-oauth2.yml
      - optional:classpath:application-local.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/savora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: false
server:
  port: ${SERVER_PORT:8080}

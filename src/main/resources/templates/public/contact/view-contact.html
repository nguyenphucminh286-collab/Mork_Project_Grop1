<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Savora Fine Dining &amp; Restaurant</title>
    <script src="/assets/js/common/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/public/global.css?v=3">
    <link rel="stylesheet" href="/assets/css/public/contact.css?v=2">
</head>
<body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="contact">
        <section class="container contact__feedback-section" id="feedback-section">
            <div class="contact__feedback-grid">
                <!-- Left Column: Clean User Feedback Form (Name, Email, Message) -->
                <div class="contact__feedback-card">
                    <p class="contact__eyebrow" style="color: var(--primary-color);">CONTACT &amp; FEEDBACK</p>
                    <h2 class="contact__feedback-title">Send Us Your Feedback</h2>
                    <p class="contact__feedback-desc">
                        Share your thoughts or questions with us below.
                    </p>

                    <div id="feedback-alert" class="contact__alert" style="display: none;"></div>

                    <form id="user-feedback-form" class="contact__form">
                        <div class="contact__field">
                            <label for="fb-name">Name *</label>
                            <input type="text" id="fb-name" class="contact__input"
                                   th:value="${session.fullName != null ? session.fullName : ''}"
                                   placeholder="Your name" required>
                        </div>

                        <div class="contact__field">
                            <label for="fb-email">Email *</label>
                            <input type="email" id="fb-email" class="contact__input"
                                   th:value="${session.authUser != null ? session.authUser.email : ''}"
                                   placeholder="you@example.com" required>
                        </div>

                        <div class="contact__field">
                            <label for="fb-message">Message *</label>
                            <textarea id="fb-message" class="contact__input contact__textarea" rows="4"
                                      placeholder="Write your feedback or message here..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary contact__submit-btn" id="btn-submit-feedback">
                            Send Feedback
                        </button>
                    </form>
                </div>

                <!-- Right Column: Basic Restaurant Contact Information -->
                <div class="contact__side-stack">
                    <section class="contact__card">
                        <span class="contact__icon">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="m4 7 8 6 8-6"/>
                            </svg>
                        </span>
                        <h3>Concierge</h3>
                        <ul>
                            <li>Hotline: <a href="tel:19006868">1900 6868</a></li>
                            <li>Email: <a href="mailto:concierge@savora.vn">concierge@savora.vn</a></li>
                        </ul>
                    </section>

                    <section class="contact__card">
                        <span class="contact__icon">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                                <path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 1 1 14 0Z"/>
                                <circle cx="12" cy="10" r="2.5"/>
                            </svg>
                        </span>
                        <h3>Location &amp; Hours</h3>
                        <address>Hoa Lac Hi-Tech Park, Thach That, Hanoi</address>
                        <p style="margin-top: 8px; color: var(--text-muted); font-size: 0.9rem;">
                            <strong>Open Daily:</strong> 10:00 AM – 10:30 PM
                        </p>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>
    <script src="/assets/js/common/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('user-feedback-form');
            const alertBox = document.getElementById('feedback-alert');
            const submitBtn = document.getElementById('btn-submit-feedback');

            form?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('fb-name').value.trim();
                const email = document.getElementById('fb-email').value.trim();
                const message = document.getElementById('fb-message').value.trim();

                alertBox.style.display = 'none';
                submitBtn.disabled = true;
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Sending...';

                try {
                    await SavoraApp.fetchApi('/api/public/contact/feedback', {
                        method: 'POST',
                        body: JSON.stringify({ name, email, message })
                    });

                    alertBox.className = 'contact__alert contact__alert--success';
                    alertBox.textContent = '✓ Thank you for your feedback! We value your feedback and will get back to you soon.';
                    alertBox.style.display = 'block';

                    document.getElementById('fb-message').value = '';
                } catch (err) {
                    alertBox.className = 'contact__alert contact__alert--error';
                    alertBox.textContent = err.message || 'Failed to send feedback.';
                    alertBox.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            });
        });
    </script>
</body>
</html>
